[project]
name = "agentdock"
version = "0.6.0"
description = "Personal floating Agent workbench: QAI ask_user answer panel + Agent/MCP config management"
requires-python = ">=3.12"
dependencies = [
  "PySide6-Essentials>=6.7",
  "mcp>=1.20,<2",
  "tomlkit>=0.13",
  "pydantic>=2.7",
  "psutil>=5.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
